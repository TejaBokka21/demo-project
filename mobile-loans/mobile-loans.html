
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Loans</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f1f5f9;
}

header {
    background: #123b70;
    color: white;
    padding: 20px 5%;
    display: flex;
    justify-content: space-between;
}

header a {
    color: white;
    text-decoration: none;
}

.container {
    text-align: center;
    padding: 40px 20px;
}

.loans {
    max-width: 1000px;
    margin: 30px auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 12px #0002;
}

button {
    background: #1765b5;
    color: white;
    padding: 12px 22px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

@media(max-width:650px) {
    .loans {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h2>ABC BANK</h2>
    <a href="index.html">Home</a>
</header>

<div class="container">
    <h1>Mobile Loan Services</h1>
    <p>Explore our different loan options.</p>

    <div class="loans">

        <div class="card">
            <h2>🏠 Home Loan</h2>
            <p>Financial support for purchasing a home.</p>
            <button onclick="applyLoan('Home Loan')">Apply Now</button>
        </div>

        <div class="card">
            <h2>🎓 Education Loan</h2>
            <p>Financial support for higher education.</p>
            <button onclick="applyLoan('Education Loan')">Apply Now</button>
        </div>

        <div class="card">
            <h2>💰 Personal Loan</h2>
            <p>Loans for personal financial requirements.</p>
            <button onclick="applyLoan('Personal Loan')">Apply Now</button>
        </div>

    </div>
</div>

<script>
function applyLoan(loan) {
    alert(loan + " selected. Demo application only.");
}
</script>

</body>
</html>
