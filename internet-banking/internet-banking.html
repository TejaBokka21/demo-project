
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet Banking</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #eaf1fa;
}

header {
    background: #123b70;
    color: white;
    padding: 20px 5%;
    display: flex;
    justify-content: space-between;
}

header a {
    color: white;
    text-decoration: none;
}

.login {
    width: 90%;
    max-width: 400px;
    background: white;
    margin: 80px auto;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px #0002;
    text-align: center;
}

input {
    width: 100%;
    padding: 13px;
    margin: 12px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    width: 100%;
    padding: 13px;
    background: #1765b5;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #123b70;
}

a {
    color: #1765b5;
}
</style>
</head>

<body>

<header>
    <h2>ABC BANK</h2>
    <a href="index.html">Home</a>
</header>

<div class="login">
    <h1>Internet Banking</h1>
    <p>Login to your account</p>

    <form onsubmit="login(event)">
        <input type="text" placeholder="Customer ID" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p><a href="#" onclick="forgotPassword(event)">Forgot Password?</a></p>
</div>

<script>
function login(event) {
    event.preventDefault();
    alert("Demo login submitted successfully!");
}

function forgotPassword(event) {
    event.preventDefault();
    alert("Please contact your bank for password recovery.");
}
</script>

</body>
</html>
